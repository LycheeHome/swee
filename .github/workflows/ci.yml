name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -q

  release-please:
    # Push-only. The workflow gained a pull_request trigger so the test job
    # runs on PRs; without this guard release-please would run there too —
    # and it asks for contents:write and pull-requests:write, which a FORK
    # PR's token cannot grant whatever this block says. Every external
    # contributor would see a failed check unrelated to their change.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
