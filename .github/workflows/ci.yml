name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -q

  release-please:
    # Push-only. The workflow gained a pull_request trigger so the test job
    # runs on PRs; without this guard release-please would run there too —
    # and it asks for contents:write and pull-requests:write, which a FORK
    # PR's token cannot grant whatever this block says. Every external
    # contributor would see a failed check unrelated to their change.
    # deploy has needs: release-please, so skipping this skips that too,
    # which is correct: deploy must never run on a PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: self-hosted
    steps:
      - name: Pull latest and restart service
        env:
          SWEE_DIR: ${{ vars.SWEE_DIR }}
          SWEE_USER: ${{ vars.SWEE_USER }}
        run: |
          set -euo pipefail
          : "${SWEE_DIR:?SWEE_DIR repo variable must be set}"
          if [ -n "${SWEE_USER:-}" ]; then
            sudo -u "$SWEE_USER" -H "$SWEE_DIR/deploy/ci-deploy.sh"
          else
            cd "$SWEE_DIR"
            git pull --ff-only origin main
            .venv/bin/pip install -q -r requirements.txt
          fi
          sudo systemctl restart swee
